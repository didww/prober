name: CI

on:
  push:
    branches: [go-rewrite, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "not gofmt'd:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      # The engine's integration tests need raw ICMP sockets. They run as root
      # inside an unprivileged user + network namespace — no host capability
      # needed. Ubuntu 24.04 (ubuntu-latest) restricts unprivileged user
      # namespaces via AppArmor, so lift that restriction first; the '|| true'
      # keeps this working on kernels without the knob.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Engine integration tests (raw sockets in a namespace)
        run: unshare -Urn sh -c 'ip link set lo up && go test -count=1 ./internal/trace/... ./internal/backend/...'
