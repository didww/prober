# prober-backend Helm values.

replicaCount: 1

image:
  repository: ghcr.io/didww/prober-backend
  # Empty means the chart's appVersion (the release tag).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccountName: ""

# The application config. It holds the per-agent tokens and (with auth on) the
# OIDC client and cookie secrets, so the chart renders it into a Secret, not a
# ConfigMap. The listen host parts are forced to 0.0.0.0 by the chart; the
# ports below are respected.
config:
  listen:
    grpc:
      addr: "0.0.0.0:50051"
      # The gateway's TLS keypair comes from ONE of two places:
      #   - tls.secretName below (a kubernetes.io/tls Secret, mounted), or
      #   - cert/key inline here (a full PEM each) — handy inside a
      #     sops-encrypted values file, and it needs no Secret.
      # cert: |
      #   -----BEGIN CERTIFICATE-----
      # key: |
      #   -----BEGIN PRIVATE KEY-----
    http: "0.0.0.0:8080"
    metrics: "0.0.0.0:9108"
  # A single shared enrollment token: agents autoregister under the site they
  # declare. Simplest for many PoPs. Constrain with allowed_sites.
  agent_token: ""
  allowed_sites: []
  # Per-site tokens override the shared one for sites needing a stronger
  # identity. Optional.
  agents: []
  #   - site: fra
  #     token: "..."
  auth:
    enabled: false

# The TLS keypair the gRPC gateway presents to agents. Three ways, in order of
# preference for a cluster with certificate-expiry monitoring:
#
#   1. tls.secretName — an existing kubernetes.io/tls Secret (cert-manager, or
#      created by hand). Best when cert-manager renews it.
#   2. tls.cert / tls.key — the PEM here (put them in a sops-encrypted values
#      file). The chart renders a kubernetes.io/tls Secret from them, which is
#      what a Prometheus cert exporter (e.g. x509-certificate-exporter) scrapes
#      for expiry. Mounted like case 1.
#   3. config.listen.grpc.cert/key inline — no Secret at all; the key lands in
#      the ConfigMap and is NOT visible to expiry monitoring. Avoid in k8s.
#
# A kubernetes.io/tls Secret (cases 1 and 2) is the monitorable one.
tls:
  secretName: ""
  cert: ""
  key: ""

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 50051
  annotations: {}

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
affinity: {}
tolerations: []

# ---------------------------------------------------------------------------
# HTTPRoute (Gateway API) to expose the web UI — not an Ingress. Requires the
# Gateway API CRDs and a Gateway to attach to; this chart installs neither.
# ---------------------------------------------------------------------------
httpRoute:
  enabled: false
  annotations: {}
  labels: {}
  # The Gateway(s) to attach to. Required when enabled — a route with no parent
  # routes nothing, so the template refuses to render without it.
  parentRefs: []
  #  - name: external
  #    namespace: gateway-system
  #    sectionName: https
  hostnames: []
  #  - prober.example.com
  # Path prefix to match. Empty follows config.base_path — the prefix the app
  # itself serves under. Serving at a prefix without base_path needs a
  # URLRewrite filter to strip it.
  pathPrefix: ""
  filters: []
  # The SSE run stream is long-lived; 0s disables the Gateway's request timeout
  # so a trace is not cut mid-stream.
  timeouts:
    request: 0s
    backendRequest: 0s

  # HTTP -> HTTPS redirect, as a SECOND route with no backend (Gateway API
  # forbids a RequestRedirect on a rule that also has backendRefs).
  #
  # redirParentRefs is both the switch and the setting: name the PLAINTEXT
  # listener here to emit the redirect route. Empty = no redirect (many Gateways
  # redirect at the listener instead, which is cheaper). Do NOT point it at the
  # https listener above — that would 301 already-secure traffic in a loop.
  redirParentRefs: []
  #  - name: external
  #    namespace: gateway-system
  #    sectionName: http
  # Defaults to `hostnames` above, which is almost always right.
  redirHostnames: []
  # 301 permanent, 302 temporary, 308 permanent preserving the method.
  redirStatusCode: 301
  # Only if https is not on 443.
  redirPort: ""

# ---------------------------------------------------------------------------
# PodMonitor (Prometheus Operator) — scrapes the pod's metrics port directly,
# which is why the chart forces metrics.listen to 0.0.0.0. Requires the
# monitoring.coreos.com CRDs; whether your Prometheus picks it up depends on
# its podMonitorSelector (often a release label, set via podMonitor.labels).
# ---------------------------------------------------------------------------
podMonitor:
  enabled: false
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  relabelings: []
  metricRelabelings: []
