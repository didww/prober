version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # The stream is deliberately one service with one RPC whose message types
    # are named for the side that sends them, not for the RPC.
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
