# prober-agent configuration. Runs at a PoP; dials the backend and needs
# CAP_NET_RAW.
backend:
  address: "prober-backend.example.com:50051"
  site: fra
  token_file: /opt/prober-agent/etc/token
  ca_file: /opt/prober-agent/etc/backend-ca.pem
  # ca: |                      # inline CA instead of ca_file
  # server_name: prober-backend.example.com
  # Verify the chain to the CA but not the certificate's hostname/SAN — for
  # when the agent dials the backend by a name not in the cert (a k8s Service
  # name, an internal address). Weaker than full verification, far stronger
  # than insecure_skip_verify.
  # skip_hostname_verify: false
  # insecure_skip_verify: false

limits:
  max_concurrent_jobs: 20
  max_cycles: 1000
  min_interval_ms: 100
  max_ttl: 40

# Where the DNS tool sends its questions. Leave unset to use this host's
# resolv.conf, which is the point of the tool: it shows what the site's own
# resolver answers. Override only when the container's resolv.conf is not the
# one that matters. Entries are an address or address:port.
# dns:
#   nameservers: ["10.0.0.53", "[2001:db8::53]:53"]
