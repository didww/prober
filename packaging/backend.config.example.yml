# prober-backend configuration.
#
# Three listeners: gRPC for agents (TLS + per-agent token), HTTP for the
# browser (SPA + REST + SSE, optional OIDC), and Prometheus metrics.
listen:
  grpc:
    addr: "0.0.0.0:50051"
    # The gateway's TLS keypair: as file paths, or inline (a full PEM each).
    cert_file: /opt/prober-backend/etc/tls.crt
    key_file: /opt/prober-backend/etc/tls.key
    # cert: |
    #   -----BEGIN CERTIFICATE-----
    #   ...
    # key: |
    #   -----BEGIN PRIVATE KEY-----
    #   ...
  http: "0.0.0.0:8080"
  metrics: "127.0.0.1:9108"

# base_path: /prober          # mount the UI under a sub-path (behind nginx)

# Agent authentication. Two options, and they can be combined.
#
# A single shared enrollment token: any agent presenting it registers under the
# site it declares, so a new PoP needs only the token, no config change here.
# Constrain it with allowed_sites when you can enumerate the sites.
agent_token: "CHANGEME-shared-enrollment-token"
allowed_sites: [fra, ams, nyc, lac, mia, sg, hk, me]

# Per-site tokens, for sites that need a stronger identity than the shared
# token. A token here is authoritative for its site and overrides the shared
# one. Optional; leave empty to use only the shared token.
agents: []
#   - site: fra
#     token: "CHANGEME-fra-token"

# OIDC login for the UI. Off means every browser request is anonymous.
auth:
  enabled: false
  # issuer: https://idp.example.com/realms/ops
  # client_id: prober
  # client_secret: ""
  # redirect_url: https://prober.example.com/api/auth/callback
  # cookie_secret: ""          # >= 32 bytes: openssl rand -hex 32
  # allowed_groups: [noc]

# ---------------------------------------------------------------------------
# Predefined monitoring (stage 2). The backend pushes this list to each agent
# as a versioned assignment on connect and on SIGHUP reload; the agent runs the
# probes on its own schedule and reports back. Results become Prometheus metrics
# (prober_monitor_*), and each completed trace/mtr is written to VictoriaLogs.
#
# kind: trace (mtr) | ping (single-hop RTT) | sip (SIP OPTIONS)
# sites: optional; empty means every connected agent runs it.
# labels: operator dimensions, exposed on prober_monitor_info and in the logs.
monitors: []
#   - id: supplier1-sip
#     kind: sip
#     target: 46.19.210.7
#     interval_s: 10
#     sites: [fra, ams]
#     labels: { supplier: supplier1, supplier_id: "123" }
#     sip: { transport: udp, port: 5060, timeout_ms: 5000 }
#   - id: supplier1-mtr
#     kind: trace
#     target: 46.19.210.7
#     interval_s: 60
#     labels: { supplier: supplier1 }
#     trace: { protocol: icmp, family: ipv4, max_ttl: 30, cycles: 1 }
#   - id: gw-ping
#     kind: ping
#     target: 1.1.1.1
#     interval_s: 15
#     trace: { protocol: icmp, family: ipv4, cycles: 3 }

# VictoriaLogs: where trace/mtr results are shipped, one record per completed
# trace with the full mtr report in _msg and the destination hop's loss and RTT
# as fields. Empty url disables shipping; metrics still work.
victorialogs:
  url: ""                       # e.g. http://victorialogs:9428 (base, no /insert path)
  # username: ""
  # password: ""
  # account_id: 0
  # project_id: 0
  stream_fields: [site, monitor]
  batch_max: 500
  flush_interval_ms: 2000
