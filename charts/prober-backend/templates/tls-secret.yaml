{{- if and (not .Values.tls.secretName) .Values.tls.cert .Values.tls.key }}
# A kubernetes.io/tls Secret rendered from tls.cert/tls.key. This is the type a
# Prometheus certificate-expiry exporter watches, so the gateway's cert is
# monitored like any other. Put tls.cert/tls.key in a sops-encrypted values file.
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ include "prober-backend.fullname" . }}-tls
  labels:
    {{- include "prober-backend.labels" . | nindent 4 }}
stringData:
  tls.crt: |
    {{- .Values.tls.cert | nindent 4 }}
  tls.key: |
    {{- .Values.tls.key | nindent 4 }}
{{- end }}
