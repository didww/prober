name: CI

on:
  push:
    branches: [go-rewrite, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "not gofmt'd:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      # The engine's integration tests need raw ICMP sockets. They run as root
      # inside an unprivileged user + network namespace — no host capability
      # needed. Ubuntu 24.04 (ubuntu-latest) restricts unprivileged user
      # namespaces via AppArmor, so lift that restriction first; the '|| true'
      # keeps this working on kernels without the knob.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The dummy interface gives the engine's leak check an address that
      # never answers. The module may need loading on the host first; where
      # it is unavailable that half of the check skips.
      - name: Engine integration tests (raw sockets in a namespace)
        run: |
          sudo modprobe dummy || true
          unshare -Urn sh -c 'ip link set lo up && (ip link add d0 type dummy && ip addr add 10.99.0.1/24 dev d0 && ip link set d0 up || true) && PROBER_LEAK_TESTS=1 go test -count=1 ./internal/trace/... ./internal/backend/...'

      - name: Engine leak checks
        run: make test-leak
